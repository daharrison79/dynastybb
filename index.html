<!DOCTYPE html>
<html lang="en">

<head>
    <title>Dynasty Analytics</title>

    <style>

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .login-box {
            text-align: center;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            border-top: 4px solid #ff008c;
        }

        input {
            padding: 10px;
            margin-top: 15px;
            width: 250px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #00d4ff;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Dynasty Analytics</h1>

        <label for=""password">
            Enter password
        </label>

        <input
            type="password"
            id="password">

        <br>

        <button onclick="checkPassword()">
            Access Site
        </button>

        <p id="error"></p>

    </div>

<script>
if (
    sessionStorage.getItem(
        "authenticated"
    ) === "true"
) {
    window.location.href =
        "portal.html";
}

function checkPassword() {

    const password =
        document.getElementById(
            "password"
        ).value;

    if (password === "Dynasty2026") {
        sessionStorage.setItem(
                "authenticated",
                "true"
        );

        window.location.href =
            "portal.html";

    } else {

        document.getElementById(
            "error"
        ).textContent =
            "Incorrect password";

    }

}

</script>

</body>
</html>
